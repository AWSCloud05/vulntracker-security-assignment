apiVersion: v1
kind: Namespace
metadata:
  name: vulntracker
  labels:
    app: vulntracker

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulntracker
  namespace: vulntracker
  labels:
    app: vulntracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulntracker
  template:
    metadata:
      labels:
        app: vulntracker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vulntracker
          image: localhost:5001/vulntracker@sha256:428992f493af090251dfbec0993d130ac850d1ce437c3ccfd923d106ac9e7e93
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
