apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vulntracker-ingress-policy
  namespace: vulntracker
spec:
  podSelector:
    matchLabels:
      app: vulntracker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access-vulntracker: "true"
      ports:
        - protocol: TCP
          port: 8000
